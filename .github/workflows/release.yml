name: Build & Release VSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VSIX
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Shipped scripts only: a check on a test file that this line removed
      # fails the whole run before a single test executes (v0.5.0 did).
      - name: Syntax checks
        run: |
          node --check extension.js
          node --check src/protocol.js
          node --check src/websocket.js
          node --check webview/app.js
          node --check webview/markdown.js

      - name: Install jsdom
        run: npm install --no-save jsdom

      # The suites drive the real extension and webview scripts against a fake
      # harness; DSH_CHECKOUT_NODE_MODULES is where they look for jsdom.
      - name: Run tests
        env:
          DSH_CHECKOUT_NODE_MODULES: ${{ github.workspace }}/node_modules
        run: |
          node test/respond-wire-verify.js
          node test/session-list-filter-verify.js
          node test/launch-flags-verify.js
          node test/approval-card-verify.js
          node test/attach-paste-verify.js
          node test/live-sync-verify.js
          node test/pill-menu-verify.js
          node test/header-composer-verify.js
          node test/blank-session-verify.js
          node test/panel-fixes-verify.js
          node test/spawn-verify.js
          # real-launch-verify.js needs a local DSH checkout (DSH_CHECKOUT) and is
          # therefore a manual test, not a CI gate.

      - name: Install vsce
        run: npm install --global @vscode/vsce

      - name: Package VSIX
        run: vsce package
        # 注:package.json 中文乱码是 Windows 上 vsce 的 GBK 转码问题;
        # Linux runner 输出为干净 UTF-8,无需 test/fix-vsix.ps1 修复。

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: artifacts

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          section="${GITHUB_REF_NAME#v}"
          awk -v sec="## ${section}" '$0==sec{on=1;next} on&&/^## /{exit} on{print}' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG section found for ${section}" >&2
            exit 1
          fi

      - name: Delete stale release for this tag (re-publish safety)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${GITHUB_REF_NAME}" --yes || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*.vsix
          body_path: RELEASE_NOTES.md
